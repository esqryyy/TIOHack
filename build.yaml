name: Build TIOHack

on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ldid xz

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos $THEOS
          curl -LO https://github.com/theos/sdks/archive/master.tar.gz
          tar -xzf master.tar.gz --strip=1 -C $THEOS/sdks theos-sdks-master/iPhoneOS16.5.sdk
        env:
          THEOS: /usr/local/theos

      - name: Build package
        run: make package
        env:
          THEOS: /usr/local/theos

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: TIOHack-deb
          path: packages/*.deb
